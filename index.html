<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní AZ-Kvíz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- 1. ÚVODNÍ OBRAZOVKA -->
        <div id="screen-intro" class="screen">
            <h1>AZ-KVÍZ</h1>
            <p class="subtitle">Vytvořte si vlastní kvíz, hrajte online na 2 zařízeních s přáteli.</p>
            
            <div class="intro-grid">
                <div class="intro-card setup">
                    <h3>➕ Vytvořit nový AZ-kvíz</h3>
                    <button id="btn-create-quiz" class="btn primary">Vytvořit kvíz</button>
                </div>
                <div class="intro-card upload">
                    <h3>📤 Nahrát ze souboru</h3>
                    <label class="btn secondary">
                        Vybrat soubor (JSON)
                        <input type="file" id="upload-questions-input" accept=".json" style="display: none;">
                    </label>
                </div>
            </div>
        </div>

        <!-- 2. PRŮVODCE TVORBOU OTÁZEK -->
        <div id="screen-creator" class="screen" style="display: none;">
            <h2>Krok 2: Hlavní otázky (28)</h2>
            <div class="creator-actions">
                <button id="btn-download-json" class="btn success">💾 Uložit do souboru</button>
                <button id="btn-start-game" class="btn primary" style="display: none;">🎮 Přejít ke hře</button>
            </div>
            <div id="creator-grid" class="creator-grid"></div>
        </div>

        <!-- MODÁLNÍ OKNO PRO ZÁPIS JEDNÉ OTÁZKY -->
        <div id="creator-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3 id="modal-title">Nová: Otázka č. 1</h3>
                <label>Znění otázky *</label>
                <textarea id="input-q-text" placeholder="Např. Jak se jmenuje nejdelší řeka protékající Českou republikou?"></textarea>
                <label>Správná odpověď *</label>
                <input type="text" id="input-q-answer" placeholder="Např. Vltava">
                <div class="modal-buttons">
                    <button id="btn-modal-cancel" class="btn danger">Zrušit</button>
                    <button id="btn-modal-save" class="btn success">✔️ Uložit otázku</button>
                </div>
            </div>
        </div>

        <!-- 3. HERNÍ OBRAZOVKA (MULTIPLAYER) -->
        <div id="screen-game" class="screen" style="display: none;">
            <div id="status-bar">Čekání na připojení hráčů...</div>
            
            <!-- Herní deska z šestiúhelníků -->
            <div id="az-pyramid"></div>

            <!-- Box s aktivní otázkou během hry -->
            <div id="game-question-box" class="question-box" style="display: none;">
                <h3 id="game-question-title">Otázka č. X</h3>
                <p id="game-question-text">Text...</p>
                <div id="game-answer-zone">
                    <input type="text" id="game-player-answer" placeholder="Napište odpověď...">
                    <button id="btn-game-submit" class="btn success">Odeslat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
